<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mindfulness Assessment</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:#f4f7f6;
  color:#263238;
}

.container{
  width:92%;
  max-width:900px;
  margin:40px auto;
}

.card{
  background:white;
  border-radius:18px;
  padding:35px;
  box-shadow:0 8px 30px rgba(0,0,0,0.08);
}

h1{
  text-align:center;
  margin-top:0;
  color:#245c54;
}

h2{
  color:#245c54;
}

.subtitle{
  text-align:center;
  color:#667;
  margin-bottom:30px;
}

.hidden{
  display:none !important;
}

input,
select{
  width:100%;
  padding:14px;
  border:1px solid #ccd6d4;
  border-radius:10px;
  font-size:16px;
  margin-top:8px;
}

label{
  font-weight:bold;
}

.button{
  display:block;
  width:100%;
  border:0;
  padding:15px;
  margin-top:25px;
  border-radius:10px;
  background:#245c54;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.button:hover{
  opacity:.9;
}

.category-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
  margin-top:25px;
}

.category{
  border:2px solid #d9e3e1;
  padding:20px;
  border-radius:14px;
  cursor:pointer;
  text-align:center;
  background:white;
  transition:.2s;
}

.category:hover{
  border-color:#245c54;
  transform:translateY(-2px);
}

.category.selected{
  border-color:#245c54;
  background:#edf6f4;
}

.question-number{
  color:#777;
  font-size:14px;
  margin-bottom:10px;
}

.question{
  font-size:22px;
  font-weight:bold;
  line-height:1.4;
  margin-bottom:25px;
}

.option{
  border:1px solid #d6dfdd;
  border-radius:12px;
  padding:15px;
  margin:10px 0;
  cursor:pointer;
  transition:.2s;
}

.option:hover{
  background:#f1f7f5;
}

.option.selected{
  background:#e3f1ed;
  border-color:#245c54;
}

.progress{
  height:8px;
  background:#e2e8e6;
  border-radius:10px;
  overflow:hidden;
  margin-bottom:25px;
}

.progress-bar{
  height:100%;
  width:0%;
  background:#245c54;
  transition:.3s;
}

.result{
  text-align:center;
}

.score{
  font-size:50px;
  font-weight:bold;
  color:#245c54;
}

.result-title{
  font-size:28px;
  font-weight:bold;
  margin:15px 0;
}

.result-text{
  color:#667;
  line-height:1.7;
}

.status{
  text-align:center;
  margin-top:15px;
  font-weight:bold;
}

.warning{
  background:#fff5e5;
  border:1px solid #f0c36d;
  padding:15px;
  border-radius:10px;
  margin-top:20px;
  color:#76591f;
}

@media(max-width:650px){

  .container{
    width:95%;
    margin:20px auto;
  }

  .card{
    padding:25px 20px;
  }

  .category-grid{
    grid-template-columns:1fr;
  }

  .question{
    font-size:19px;
  }

}

</style>
</head>


<body>

<div class="container">

  <!-- NAME SCREEN -->

  <div class="card" id="nameScreen">

    <h1>Mindfulness Assessment</h1>

    <p class="subtitle">
      Take a few moments to understand your current workplace mindset.
    </p>

    <label for="userName">
      Your Name
    </label>

    <input
      type="text"
      id="userName"
      placeholder="Enter your name"
      autocomplete="off"
    >

    <button
      class="button"
      onclick="startAssessment()"
    >
      Continue
    </button>

    <div
      id="nameError"
      class="warning hidden"
    >
      Please enter your name before continuing.
    </div>

  </div>


  <!-- CATEGORY SCREEN -->

  <div class="card hidden" id="categoryScreen">

    <h1>Select Your Department</h1>

    <p class="subtitle">
      Select the department that applies to you.
    </p>

    <div
      class="category-grid"
      id="categoryGrid"
    ></div>

    <button
      class="button"
      onclick="startQuestions()"
    >
      Start Assessment
    </button>

    <div
      id="categoryError"
      class="warning hidden"
    >
      Please select a department.
    </div>

  </div>


  <!-- QUESTION SCREEN -->

  <div class="card hidden" id="questionScreen">

    <div class="progress">
      <div
        class="progress-bar"
        id="progressBar"
      ></div>
    </div>

    <div
      class="question-number"
      id="questionNumber"
    ></div>

    <div
      class="question"
      id="questionText"
    ></div>

    <div id="options"></div>

    <button
      class="button"
      id="nextButton"
      onclick="nextQuestion()"
    >
      Next
    </button>

  </div>


  <!-- RESULT SCREEN -->

  <div class="card hidden" id="resultScreen">

    <div class="result">

      <h1>Assessment Complete</h1>

      <div
        class="score"
        id="score"
      >
        0
      </div>

      <div
        class="result-title"
        id="resultTitle"
      ></div>

      <p
        class="result-text"
        id="resultText"
      ></p>

      <div
        class="status"
        id="saveStatus"
      >
        Saving your result...
      </div>

    </div>

  </div>

</div>


<!-- Hidden iframe used for Google Apps Script submission -->

<iframe
  name="sheetsSubmitFrame"
  id="sheetsSubmitFrame"
  style="display:none;"
></iframe>


<script>

/* =========================================================
   GOOGLE APPS SCRIPT URL
   ========================================================= */

const SHEETS_URL =
"https://script.google.com/macros/s/AKfycbyfVv__LXret_FJy-voRmKzpRUQgPRtEVz5IGoW-JERlwctvnB0gUZ7Lpx6dhGlrvVW/exec";


/* =========================================================
   ONE ATTEMPT RESTRICTION
   ========================================================= */

const LOCK_KEY = "mindfulness_assessment_completed";


/* =========================================================
   DEPARTMENTS
   ========================================================= */

const departments = [

  {
    id:"operations",
    name:"Operations Department"
  },

  {
    id:"hr",
    name:"HR Department"
  },

  {
    id:"sales",
    name:"Sales Department"
  },

  {
    id:"compliance",
    name:"Compliance Department"
  },

  {
    id:"finance",
    name:"Finance Department"
  },

  {
    id:"travel",
    name:"Travel Department"
  },

  {
    id:"attendance",
    name:"Attendance Department"
  }

];


/* =========================================================
   QUESTIONS
   ========================================================= */

const questions = [

  {
    q:"How often do you feel mentally present while working?",
    options:[
      "Almost always",
      "Often",
      "Sometimes",
      "Rarely"
    ]
  },

  {
    q:"How well are you able to manage work-related stress?",
    options:[
      "Very well",
      "Well",
      "Sometimes difficult",
      "Very difficult"
    ]
  },

  {
    q:"When work becomes overwhelming, what do you usually do?",
    options:[
      "Prioritize and stay calm",
      "Take a short break",
      "Continue working despite the pressure",
      "Feel completely overwhelmed"
    ]
  },

  {
    q:"How comfortable are you discussing concerns with colleagues?",
    options:[
      "Very comfortable",
      "Comfortable",
      "Somewhat uncomfortable",
      "Very uncomfortable"
    ]
  },

  {
    q:"How often do you take short mental breaks during work?",
    options:[
      "Regularly",
      "Often",
      "Sometimes",
      "Almost never"
    ]
  },

  {
    q:"How focused are you during important tasks?",
    options:[
      "Extremely focused",
      "Quite focused",
      "Sometimes distracted",
      "Frequently distracted"
    ]
  },

  {
    q:"How well do you maintain a healthy work-life balance?",
    options:[
      "Very well",
      "Well",
      "Needs improvement",
      "Poorly"
    ]
  },

  {
    q:"How do you react when something does not go according to plan?",
    options:[
      "Stay calm and adapt",
      "Try to solve it quickly",
      "Become somewhat stressed",
      "Become very stressed"
    ]
  },

  {
    q:"How often do you reflect on your thoughts and emotions?",
    options:[
      "Daily",
      "Several times a week",
      "Occasionally",
      "Rarely"
    ]
  },

  {
    q:"Overall, how mindful do you feel at work?",
    options:[
      "Highly mindful",
      "Generally mindful",
      "Sometimes mindful",
      "Need to improve"
    ]
  }

];


/* =========================================================
   VARIABLES
   ========================================================= */

let user = "";

let role = "";

let currentQuestion = 0;

let total = 0;

let answers = [];

let selectedAnswer = null;


/* =========================================================
   PAGE ELEMENTS
   ========================================================= */

const nameScreen =
document.getElementById("nameScreen");

const categoryScreen =
document.getElementById("categoryScreen");

const questionScreen =
document.getElementById("questionScreen");

const resultScreen =
document.getElementById("resultScreen");


/* =========================================================
   CHECK WHETHER USER HAS ALREADY COMPLETED TEST
   ========================================================= */

window.addEventListener("load", function(){

  if(localStorage.getItem(LOCK_KEY) === "yes"){

    document.querySelector(".container").innerHTML = `

      <div class="card">

        <div class="result">

          <h1>Assessment Already Completed</h1>

          <p class="result-text">
            You have already completed the Mindfulness Assessment
            on this device.
          </p>

        </div>

      </div>

    `;

    return;

  }


  createCategories();

});


/* =========================================================
   CREATE DEPARTMENT BUTTONS
   ========================================================= */

function createCategories(){

  const grid =
  document.getElementById("categoryGrid");

  grid.innerHTML = "";


  departments.forEach(function(department){

    const div =
    document.createElement("div");

    div.className = "category";

    div.textContent = department.name;

    div.onclick = function(){

      document
      .querySelectorAll(".category")
      .forEach(function(item){

        item.classList.remove("selected");

      });


      div.classList.add("selected");

      role = department.id;

      document
      .getElementById("categoryError")
      .classList.add("hidden");

    };


    grid.appendChild(div);

  });

}


/* =========================================================
   START ASSESSMENT
   ========================================================= */

function startAssessment(){

  const input =
  document.getElementById("userName");

  user =
  input.value.trim();


  if(!user){

    document
    .getElementById("nameError")
    .classList.remove("hidden");

    return;

  }


  nameScreen.classList.add("hidden");

  categoryScreen.classList.remove("hidden");

}


/* =========================================================
   START QUESTIONS
   ========================================================= */

function startQuestions(){

  if(!role){

    document
    .getElementById("categoryError")
    .classList.remove("hidden");

    return;

  }


  categoryScreen.classList.add("hidden");

  questionScreen.classList.remove("hidden");


  currentQuestion = 0;

  total = 0;

  answers = [];

  selectedAnswer = null;


  showQuestion();

}


/* =========================================================
   SHOW QUESTION
   ========================================================= */

function showQuestion(){

  const question =
  questions[currentQuestion];


  document
  .getElementById("questionNumber")
  .textContent =
  "Question " +
  (currentQuestion + 1) +
  " of " +
  questions.length;


  document
  .getElementById("questionText")
  .textContent =
  question.q;


  const progress =
  ((currentQuestion) /
  questions.length) * 100;


  document
  .getElementById("progressBar")
  .style.width =
  progress + "%";


  const options =
  document.getElementById("options");


  options.innerHTML = "";


  selectedAnswer = null;


  question.options.forEach(function(option, index){

    const div =
    document.createElement("div");

    div.className = "option";

    div.textContent = option;


    div.onclick = function(){

      document
      .querySelectorAll(".option")
      .forEach(function(item){

        item.classList.remove("selected");

      });


      div.classList.add("selected");

      selectedAnswer = index;

    };


    options.appendChild(div);

  });


  const button =
  document.getElementById("nextButton");


  if(currentQuestion === questions.length - 1){

    button.textContent =
    "Finish Assessment";

  }

  else{

    button.textContent =
    "Next";

  }

}


/* =========================================================
   NEXT QUESTION
   ========================================================= */

function nextQuestion(){

  if(selectedAnswer === null){

    alert("Please select an answer.");

    return;

  }


  const question =
  questions[currentQuestion];


  /*
    First answer = 4 points
    Second answer = 3 points
    Third answer = 2 points
    Fourth answer = 1 point
  */

  const points =
  4 - selectedAnswer;


  total += points;


  answers.push({

    question:
    question.q,

    answer:
    question.options[selectedAnswer],

    score:
    points

  });


  currentQuestion++;


  if(currentQuestion >= questions.length){

    showResult();

    return;

  }


  showQuestion();

}


/* =========================================================
   RESULT
   ========================================================= */

function showResult(){

  questionScreen.classList.add("hidden");

  resultScreen.classList.remove("hidden");


  document
  .getElementById("score")
  .textContent =
  total + " / " + (questions.length * 4);


  let title = "";

  let text = "";


  if(total >= 34){

    title =
    "Highly Mindful";

    text =
    "You demonstrate strong mindfulness and awareness in your workplace approach. You appear to manage pressure, stay focused and maintain a balanced mindset.";

  }

  else if(total >= 25){

    title =
    "Grounded & Aware";

    text =
    "You demonstrate a generally healthy level of mindfulness. There are good habits in place, with some opportunities to become even more aware and balanced.";

  }

  else if(total >= 18){

    title =
    "Building Awareness";

    text =
    "Your mindfulness is developing. Small changes in how you manage stress, focus and reflect can make a meaningful difference.";

  }

  else{

    title =
    "Opportunity to Grow";

    text =
    "There is an opportunity to strengthen your mindfulness habits. Consider taking regular breaks, reflecting on your emotions and creating healthier ways to manage pressure.";

  }


  document
  .getElementById("resultTitle")
  .textContent =
  title;


  document
  .getElementById("resultText")
  .textContent =
  text;


  sendResult(title);

}


/* =========================================================
   SEND RESULT TO GOOGLE SHEETS
   ========================================================= */

function sendResult(title){

  const status =
  document.getElementById("saveStatus");


  /*
    IMPORTANT:
    We are NOT using fetch() or JSON here.

    We are submitting a normal HTML form
    because Apps Script reads e.parameter.
  */


  const form =
  document.createElement("form");


  form.method =
  "POST";


  form.action =
  SHEETS_URL;


  form.target =
  "sheetsSubmitFrame";


  form.style.display =
  "none";


  const fields = {

    name:
    user,

    category:
    getDepartmentName(),

    score:
    total,

    result:
    title,

    answers:
    JSON.stringify(answers)

  };


  Object.keys(fields).forEach(function(key){

    const input =
    document.createElement("input");


    input.type =
    "hidden";


    input.name =
    key;


    input.value =
    fields[key];


    form.appendChild(input);

  });


  document.body.appendChild(form);


  status.textContent =
  "Saving your result...";


  form.submit();


  /*
    Give Apps Script a little time
    to process the submission.
  */

  setTimeout(function(){

    status.textContent =
    "✓ Your result has been submitted successfully.";

    /*
      Lock the assessment after submission.
    */

    localStorage.setItem(
      LOCK_KEY,
      "yes"
    );

  }, 1500);

}


/* =========================================================
   GET DEPARTMENT NAME
   ========================================================= */

function getDepartmentName(){

  const department =
  departments.find(function(item){

    return item.id === role;

  });


  if(department){

    return department.name;

  }


  return role;

}

</script>

</body>
</html>
